# Build, vet and test the Go programs and the web UI.
#
# release.yml calls this workflow too, so a version tag cannot publish
# anything unless these jobs pass for the tagged commit.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: {}

permissions:
  contents: read

jobs:
  go:
    name: go fmt / build / vet / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'These files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      # web/backend embeds web/backend/dist. The UI is built into it first,
      # so the tests of the embedded brand assets run on what release.yml
      # embeds instead of skipping.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: web/frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Build the UI into web/backend/dist
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:backend

      - name: Build
        run: go build -tags goolm,stdjson ./...

      - name: Vet
        run: go vet -tags goolm,stdjson ./...

      - name: Test
        run: go test -tags goolm,stdjson -p 1 ./...

  frontend:
    name: frontend typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Installs the pnpm version pinned by packageManager in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: web/frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
